name: watch site

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub often delays scheduled runs)
  workflow_dispatch:          # adds a "Run workflow" button for manual/testing runs

permissions:
  contents: write             # lets the job commit the saved hash back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check site
        env:
          WATCH_URL: "https://www.usaroundnet.org/rankings"   # <-- the page to watch
          WATCH_SELECTOR: ""                 # <-- e.g. "#price"; leave empty for whole page
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Commit state if it changed
        run: |
          if [[ -n "$(git status --porcelain last_hash.txt)" ]]; then
            git config user.name "site-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add last_hash.txt
            git commit -m "update baseline"
            git push
          fi
